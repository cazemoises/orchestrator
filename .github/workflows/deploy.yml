name: Deploy orchestrator

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    # This job runs directly on the target VM via the self-hosted runner
    # installed there (see deploy/setup-runner.md) — no SSH access into the
    # VM is required from GitHub's side, the runner pulls jobs outbound.
    env:
      ORCHESTRATOR_BIN_DEST: /opt/orchestrator/bin/orchestrator
      SYSTEMD_SERVICE: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/orchestrator ./cmd/orchestrator

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Stop service
        run: sudo systemctl stop "${SYSTEMD_SERVICE}"

      - name: Install new binary
        run: |
          sudo install -D -m 0755 bin/orchestrator "${ORCHESTRATOR_BIN_DEST}"

      - name: Start service
        run: sudo systemctl start "${SYSTEMD_SERVICE}"

      - name: Health check
        run: |
          sleep 2
          status="$(systemctl is-active "${SYSTEMD_SERVICE}")"
          echo "service status: ${status}"
          if [ "${status}" != "active" ]; then
            echo "::error::orchestrator service is not active after deploy (status=${status})"
            sudo journalctl -u "${SYSTEMD_SERVICE}" -n 50 --no-pager || true
            exit 1
          fi
